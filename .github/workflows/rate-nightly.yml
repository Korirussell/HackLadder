name: Rate

# Rebuild and publish all ratings with the current admin config (§6.3, §8.7).
# Runs nightly to apply approved corrections and config changes, and on demand from /admin.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: pipeline-db  # never overlaps a crawl or another rating run
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - run: uv sync --locked --no-dev
      - name: Rate and publish
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run hl rate
