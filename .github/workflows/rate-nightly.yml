name: Rate

# Rebuild and publish all ratings with the current admin config (§6.3, §8.7).
# Runs nightly to apply approved corrections and config changes, and on demand from /admin.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: pipeline-db  # never overlaps a crawl or another rating run
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - run: uv sync --locked --no-dev
      - name: Rate and publish
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run hl rate
      # Refresh the cached public pages now rather than within the hour (§10). Skipped until the
      # REVALIDATE_SECRET secret is set (same value as the Vercel env var).
      - name: Revalidate the site
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [ -n "$REVALIDATE_SECRET" ]; then
            curl -fsS -X POST https://www.hackladder.com/api/revalidate -H "Authorization: Bearer $REVALIDATE_SECRET"
          fi
