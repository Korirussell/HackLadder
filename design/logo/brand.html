<!doctype html><html lang="en"><head><meta charset="utf-8"><title>HackLadder brand mark</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap" rel="stylesheet">
<style>
:root{--paper:#F6F3EC;--ink:#17140F;--signal:#FF5B14;--graphite:#6F685E;--rule:#DDD6CA;--tile:#ECE7DE}
*{box-sizing:border-box;margin:0}
body{background:var(--paper);color:var(--ink);font-family:"Bricolage Grotesque",sans-serif;padding:48px;width:1440px}
h1{font-weight:800;font-variation-settings:"opsz" 96,"wdth" 82;letter-spacing:-.05em;font-size:64px;line-height:.9;margin-bottom:36px}
.row{display:grid;gap:20px;margin-bottom:20px}
.r1{grid-template-columns:2fr 1fr 1fr}.r2{grid-template-columns:repeat(4,1fr)}
.cell{border-radius:24px;padding:24px;min-height:300px;display:flex;flex-direction:column;justify-content:space-between;background:var(--tile)}
.cell.dark{background:var(--ink);color:var(--paper)}
.cell small{font-size:14px;color:var(--graphite)}.cell.dark small{color:#B3AA9E}
.center{flex:1;display:grid;place-items:center}
.lock{display:flex;align-items:center;gap:14px}
.lock span{font-weight:800;font-variation-settings:"opsz" 60,"wdth" 82;letter-spacing:-.05em;font-size:68px;line-height:1}
.sizes{display:flex;align-items:end;gap:22px}
.tab{display:flex;align-items:center;gap:8px;background:#fff;border-radius:10px 10px 0 0;padding:8px 12px;font-size:13px}
.phone{display:flex;gap:18px;align-items:start}
.phone div{text-align:center;font-size:12px}
.phone img{border-radius:0;display:block;margin-bottom:6px}
</style></head><body>
<h1>The HackLadder mark</h1>
<div class="row r1">
 <div class="cell"><small>Primary lockup</small><div class="center"><div class="lock"><img src="mark.svg" width="96" height="96" alt=""><span>HackLadder</span></div></div></div>
 <div class="cell dark"><small>Reverse</small><div class="center"><div class="lock"><img src="mark-reverse.svg" width="72" height="72" alt=""><span style="font-size:44px">HackLadder</span></div></div></div>
 <div class="cell" style="background:#fff"><small>One colour</small><div class="center"><img src="mark-mono.svg" width="150" height="150" alt=""></div></div>
</div>
<div class="row r2">
 <div class="cell"><small>Avatar, ink (GitHub, X, Discord)</small><div class="center"><img src="avatar-ink.svg" width="170" height="170" alt=""></div></div>
 <div class="cell"><small>Avatar, signal</small><div class="center"><img src="avatar-signal.svg" width="170" height="170" alt=""></div></div>
 <div class="cell"><small>App icon on a home screen</small><div class="center phone">
   <div><img src="app-icon.svg" width="64" height="64" alt="">HackLadder</div>
   </div></div>
 <div class="cell"><small>Small sizes</small><div class="center"><div>
   <div class="sizes"><img src="mark.svg" width="48" height="48" alt=""><img src="mark.svg" width="32" height="32" alt=""><img src="mark.svg" width="24" height="24" alt=""><img src="mark.svg" width="16" height="16" alt=""></div>
   <div class="tab" style="margin-top:22px"><img src="favicon.svg" width="16" height="16" alt="">HackLadder · Every hacker…</div></div></div></div>
</div>
</body></html>
