<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Wooden H-ladder</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F6F3EC;--ink:#17140F;--graphite:#6F685E;--rule:#DDD6CA}
*{box-sizing:border-box;margin:0}
body{background:var(--paper);color:var(--ink);font-family:"Bricolage Grotesque",sans-serif;padding:48px;width:1440px}
h1{font-weight:800;font-variation-settings:"opsz" 96,"wdth" 82;letter-spacing:-.05em;font-size:64px;line-height:.9;margin-bottom:40px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:#fff8;border:1px solid var(--rule);border-radius:24px;padding:28px}
.card h2{font-size:22px;font-weight:700;letter-spacing:-.02em}
.card p{color:var(--graphite);font-size:15px;margin:4px 0 20px;min-height:44px}
img{display:block}
.big{height:240px;display:grid;place-items:center;background:var(--paper);border-radius:16px}
.sizes{display:flex;align-items:end;gap:18px;margin-top:20px}
.tab{display:flex;align-items:center;gap:8px;background:#E3DED4;border-radius:10px 10px 0 0;padding:8px 12px;font-size:13px;margin-top:18px;width:max-content}
.lock{display:flex;align-items:center;gap:10px;margin-top:18px}
.lock span{font-weight:800;font-variation-settings:"opsz" 40,"wdth" 80;letter-spacing:-.05em;font-size:30px}
.lock span.px{font-family:"Pixelify Sans";font-weight:700;letter-spacing:0;font-size:28px}
</style></head><body>
<h1>Wooden H-ladder</h1>
<div class="grid">
 <div class="card" data-v="wood"><h2>1. Wood</h2><p>Smooth Big H with nail heads where the rungs join.</p></div>
 <div class="card" data-v="wood-slant"><h2>2. Wood, leaning</h2><p>Same ladder with a 9° forward lean.</p></div>
 <div class="card" data-v="wood-plain"><h2>3. Wood, no nails</h2><p>Simplest version; cleanest at tiny sizes.</p></div>
</div>
<script>
document.querySelectorAll('.card').forEach(c=>{
 const v=c.dataset.v, im=(s,app)=>`<img src="${v}${app?'-app':''}.svg" width="${s}" height="${s}" alt="">`;
 c.insertAdjacentHTML('beforeend',`<div class="big">${im(192)}</div>
  <div class="sizes">${im(64)}${im(32)}${im(16)}${im(56,1)}</div>
  <div class="tab">${im(16)} HackLadder · Every hacker…</div>
  <div class="lock">${im(40)}<span>HackLadder</span></div>
  `);
});
</script></body></html>
