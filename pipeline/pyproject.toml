[project]
name = "hackladder"
version = "0.1.0"
description = "HackLadder data pipeline: crawl Devpost, parse, resolve, rate, publish."
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "typer>=0.27.3",
]

[project.scripts]
hl = "hackladder.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["prototype"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT", "C4", "PL"]
ignore = ["PLR2004", "PLR0913", "PLR0912"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
